name: guardtwin-edge

services:
    broker:
        build: .
        image: guardtwin-broker:latest
        container_name: guardtwin-broker
        restart: unless-stopped
        ports:
            - "${UDP_INGEST_PORT:-30491}:${UDP_INGEST_PORT:-30491}/udp"
            - "${ESCALATOR_SERVE_PORT:-30500}:${ESCALATOR_SERVE_PORT:-30500}/tcp"
            - "${NOTIFY_PORT:-8081}:${NOTIFY_PORT:-8081}/tcp"
        volumes:
            - "${GEOMETRY_FILE_HOST:-./files/geometry.geojson}:/app/geometry.geojson:ro"
        command: >
            ${VERBOSE:+-v}
            --aoi-lat ${AOI_LAT:-45.06413361104026}
            --aoi-lon ${AOI_LON:-7.6598566324570925}
            --aoi-radius ${AOI_RADIUS:-150}
            --notify-port ${NOTIFY_PORT:-8081}
            --notify-host ${NOTIFY_HOST:-192.168.0.128}
            ${SKIP_DEVICE_DETECT:+--skip-device-detect}
            --imsi ${IMSI:-001010000167802}
            --listen-port ${UDP_INGEST_PORT:-30491}
            --serve-port ${ESCALATOR_SERVE_PORT:-30500}
            --resolver-url ${RESOLVER_URL:-http://10.211.1.140:18080}
            --metrics-url ${METRICS_URL:-http://10.211.1.140:8080}
            --gnb-id f01
            --chan-penalty-max ${CHAN_PENALTY_MAX:-3.0}
            --ai-context-max ${AI_CONTEXT_MAX:-2.0}
            --llm-url http://vllm:8000
            --llm-model ${LLM_MODEL:-google/gemma-4-12B-it-qat-w4a16-ct}
            --llm-retry-s ${LLM_RETRY_S:-1.0}
            --llm-stale-s ${LLM_STALE_S:-12.0}
            --llm-http-timeout ${LLM_HTTP_TIMEOUT:-20.0}
            --geometry-file /app/geometry.geojson
            ${LLM_DISABLE:+--llm-disable}
            ${LLM_CLOCK:+--llm-clock ${LLM_CLOCK}}

    escalator:
        build: .
        image: guardtwin-broker:latest
        container_name: guardtwin-escalator
        restart: unless-stopped
        entrypoint: ["python3", "-u", "escalator.py"]
        depends_on:
            - broker
        command: >
            ${VERBOSE:+-v}
            --host broker
            --port ${ESCALATOR_SERVE_PORT:-30500}
            --aoi-lat ${AOI_LAT:-45.06413361104026}
            --aoi-lon ${AOI_LON:-7.6598566324570925}
            --aoi-radius ${AOI_RADIUS:-150}
            --devices-max-age-s ${DEVICES_MAX_AGE_S:-1}
            ${AOI_ID:+--aoi-id ${AOI_ID}}
            --risk-escalation-url ${RISK_ESCALATION_URL:-http://192.168.0.174:30090}
            --evaluator-token ${EVALUATOR_BEARER_TOKEN:-devsecret_replace_in_deployment_evaluator_token}
            --risk-escalator-aoi-id ${AOI_ID:-turin-masa-aoi-1}

    vllm:
        image: vllm/vllm-openai:v0.30.0
        container_name: guardtwin-vllm
        restart: unless-stopped
        ports:
            - "${LLM_PORT:-8000}:8000"
        volumes:
            - "vllm-cache:/root/.cache/huggingface"
        command:
            - "--model"
            - "${LLM_MODEL:-google/gemma-4-12B-it-qat-w4a16-ct}"
            # Was "${LLM_MODEL:-Qwen/Qwen2.5-7B-Instruct}"
            - "--max-model-len"
            - "${LLM_MAX_MODEL_LEN:-8192}"
            - "--gpu-memory-utilization"
            - "${LLM_GPU_MEM_UTIL:-0.85}"
            - "--limit-mm-per-prompt"
            - '{"image": 0, "audio": 0}'
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: 1
                          capabilities: [gpu]
        shm_size: "2gb"

volumes:
    vllm-cache:
        name: guardtwin-edge_vllm-cache